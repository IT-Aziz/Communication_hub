<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CommunicationHub</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <header class="navbar">
    <a class="navbar__brand" href="Userpage.html">
      CommunicationHub
    </a>
    <nav class="navbar__links" id="navLinks" data-nav-links aria-label="Primary">
      <a class="navbar__link" data-nav-link href="Userpage.html">Home</a>
      <a class="navbar__link" data-nav-link href="Supervisor.html">Supervisor</a>
      <a class="navbar__link" data-nav-link href="adminpage.html">Admin</a>
    </nav>
    <button
      type="button"
      class="navbar__toggle"
      data-nav-toggle
      aria-label="Toggle menu"
      aria-expanded="false"
      aria-controls="navLinks"
    >&#9776;</button>
  </header>

  <main class="container">
    <div id="heroSliderContainer" class="hero-slider-container" hidden></div>

    <section id="categoriesView" class="view view--active" aria-labelledby="categoriesHeading">
      <div class="page-header">
        <div>
          <h1 id="categoriesHeading">Categories</h1>
        </div>
      </div>
      <div id="categoriesGrid" class="category-grid"></div>
      <p id="categoriesEmptyState" class="empty-state" hidden>No categories are available yet.</p>
    </section>

    <section id="postsView" class="view" aria-labelledby="postsCategoryTitle">
      <button type="button" class="back-button" id="backToCategoriesButton">&larr; Back to Categories</button>
      <div class="page-header">
        <div>
          <h1 id="postsCategoryTitle"></h1>
          <p class="page-header__subtitle" id="postsCategoryDescription"></p>
        </div>
      </div>
      <div id="postsGrid" class="post-grid"></div>
      <p id="postsEmptyState" class="empty-state" hidden>No posts in this category yet.</p>
    </section>

    <section id="postDetailView" class="view">
      <button type="button" class="back-button" id="backToPostsButton">&larr; Back to Category</button>
      <article id="postDetailContent" class="post-detail"></article>
    </section>
  </main>

  <script src="./assets/js/utils.js"></script>
  <script src="./assets/data/seed-data.js"></script>
  <script src="./assets/js/data-service.js"></script>
  <script src="./assets/js/category-service.js"></script>
  <script src="./assets/js/post-service.js"></script>
  <script src="./assets/js/hero-slider.js"></script>
  <script src="./assets/js/navigation.js"></script>
  <script src="./assets/js/user-page.js"></script>
</body>
</html>
