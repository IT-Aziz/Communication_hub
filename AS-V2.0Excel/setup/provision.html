<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CommunicationHub — SharePoint setup</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 52rem; margin: 2.5rem auto; padding: 0 1.5rem; line-height: 1.6; color: #111827; }
    h1 { margin-bottom: .25rem; }
    .sub { color: #6b7280; margin-top: 0; }
    .card { border: 1px solid #e5e7eb; border-radius: .6rem; padding: 1.1rem 1.3rem; margin: 1.1rem 0; }
    button { font: inherit; font-weight: 600; padding: .6rem 1.1rem; border-radius: .45rem; border: 1px solid transparent; background: #2563eb; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    button.secondary { background: #fff; color: #111827; border-color: #d1d5db; }
    #log { background: #0f172a; color: #e2e8f0; font-family: ui-monospace, Consolas, monospace; font-size: .82rem; padding: 1rem; border-radius: .5rem; height: 26rem; overflow-y: auto; white-space: pre-wrap; margin-top: 1rem; }
    .ok { color: #4ade80; } .warn { color: #fbbf24; } .err { color: #f87171; } .dim { color: #94a3b8; }
    code { background: #f3f4f6; padding: .1rem .35rem; border-radius: .25rem; font-size: .9em; }
  </style>
</head>
<body>
  <!--
    A one-off setup page. It builds the three lists, the image library, every column with the
    exact internal name the app expects, turns on version history, and imports the existing
    records - all through the same SharePoint REST API the application itself uses.

    Why this exists rather than only a PowerShell script: PnP.PowerShell needs an Entra app
    registration to sign in with, and on a managed tenant (a university one, say) an ordinary
    site owner often cannot create one. This page needs none of that. It runs as you, in your
    browser, using the SharePoint session you already have - so being a Site Owner is enough.

    Everything here is idempotent. Anything that already exists is left alone, so re-running
    after a partial failure is safe and is in fact the intended way to recover.

    Delete this file once the setup is done.
  -->
  <h1>CommunicationHub setup</h1>
  <p class="sub">Creates the lists, columns, image library and version history, then imports your existing records.</p>

  <div class="card">
    <strong>Site detected:</strong> <code id="siteUrl">…</code><br>
    <span class="sub">This must be the site holding your lists. If it looks wrong, move this file into that site and reload.</span>
  </div>

  <div class="card">
    <button id="stepSchema">1 — Create lists &amp; columns</button>
    <button id="stepData" class="secondary">2 — Import records</button>
    <button id="stepVerify" class="secondary">3 — Verify</button>
    <p class="sub" style="margin-bottom:0">Run them in order. Safe to re-run any step.</p>
  </div>

  <div id="log">Ready.</div>

  <script>
  // ---------------------------------------------------------------- plumbing

  // SharePoint's file preview renders an .html file inside a sandboxed iframe, where the origin
  // is the literal string "null". Scripts still run, so the page looks alive while every call to
  // /_api/ fails with "Failed to parse URL from null/...". Catch that here and say so plainly,
  // rather than letting someone click Create and watch it fail three times.
  // Covers both ways this page can end up somewhere it cannot reach SharePoint: previewed in a
  // sandboxed frame (origin "null"), or downloaded and opened from disk (protocol "file:").
  // Both render and run scripts happily, so neither is visible without checking for it.
  const cannotReachSharePoint =
    window.location.protocol === "file:" ||
    window.top !== window.self ||
    window.location.origin === "null" ||
    !window.location.origin;
  const wasDownloaded = window.location.protocol === "file:";

  const webUrl = (() => {
    if (window._spPageContextInfo?.webAbsoluteUrl) return window._spPageContextInfo.webAbsoluteUrl.replace(/\/+$/, "");
    const m = window.location.pathname.match(/^\/(sites|teams)\/[^/]+/i);
    return window.location.origin + (m ? m[0] : "");
  })();

  if (cannotReachSharePoint) {
    document.getElementById("siteUrl").textContent = wasDownloaded
      ? "unavailable - this is a downloaded copy on your PC"
      : "unavailable - opened in SharePoint's preview";
    const warn = document.createElement("div");
    warn.className = "card";
    warn.style.cssText = "border:2px solid #d97706;background:#fffbeb";
    warn.innerHTML =
      (wasDownloaded
        ? "<strong>This is a downloaded copy, not a page served by SharePoint.</strong><br>" +
          "SharePoint sent the file to your Downloads folder instead of displaying it - which means " +
          "<em>Custom scripts</em> is still switched off on this site. Nothing here can run until an " +
          "admin allows it. See hosting-test.html for the exact setting."
        : "<strong>Open this page by its direct URL, not by clicking it in the library.</strong><br>" +
          "SharePoint previewed the file in a sandboxed frame, which cannot reach the REST API. " +
          "Copy the folder path from the document library, add <code>setup/provision.html</code> on the end, " +
          "and paste that into the address bar.");
    document.querySelector(".card").after(warn);
    document.querySelectorAll("button").forEach((b) => (b.disabled = true));
  } else {
    document.getElementById("siteUrl").textContent = webUrl;
  }

  const logEl = document.getElementById("log");
  function log(msg, cls = "") {
    logEl.innerHTML += `<span class="${cls}">${msg.replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]))}</span>\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  let digest = null;
  async function getDigest() {
    if (digest) return digest;
    const r = await fetch(`${webUrl}/_api/contextinfo`, {
      method: "POST", credentials: "include",
      headers: { Accept: "application/json;odata=nometadata" },
    });
    if (!r.ok) throw new Error(`Couldn't get a form digest (${r.status}). Is this page served from the SharePoint site?`);
    digest = (await r.json()).FormDigestValue;
    return digest;
  }

  async function get(path) {
    const r = await fetch(webUrl + path, { credentials: "include", headers: { Accept: "application/json;odata=nometadata" } });
    if (!r.ok) throw new Error(await describe(r));
    return r.json();
  }

  async function post(path, body, httpMethod) {
    const headers = {
      Accept: "application/json;odata=verbose",
      "Content-Type": "application/json;odata=verbose",
      "X-RequestDigest": await getDigest(),
    };
    if (httpMethod) { headers["X-HTTP-Method"] = httpMethod; headers["IF-MATCH"] = "*"; }
    const r = await fetch(webUrl + path, { method: "POST", credentials: "include", headers, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await describe(r));
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }

  async function describe(r) {
    try {
      const b = await r.json();
      return b?.error?.message?.value || b?.["odata.error"]?.message?.value || `HTTP ${r.status}`;
    } catch { return `HTTP ${r.status}`; }
  }

  const q = (s) => String(s).replace(/'/g, "''");
  const xml = (s) => String(s).replace(/[<>&"']/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;", "'": "&apos;" }[c]));

  // ---------------------------------------------------------------- schema

  const ICONS = ["briefcase","users","shield","monitor","building","calendar","bell","book","heart","megaphone","globe","wrench"];

  // Field XML rather than the simpler /fields endpoint, because only the XML form lets us set
  // the internal name explicitly. Left to itself SharePoint derives the internal name from the
  // display name - so "Category ID" would become "Category_x0020_ID" and the app, which asks
  // for CHCategoryID, would find nothing. AddFieldInternalNameHint (8) is what makes the Name
  // attribute stick; 16 adds the column to the default view so an admin can actually see it.
  const ADD_OPTIONS = 8 | 16;

  const text = (n, d) => `<Field Type='Text' DisplayName='${xml(d)}' Name='${n}' StaticName='${n}' />`;
  const note = (n, d) => `<Field Type='Note' DisplayName='${xml(d)}' Name='${n}' StaticName='${n}' RichText='FALSE' RichTextMode='Compatible' NumLines='6' />`;
  const dateTime = (n, d) => `<Field Type='DateTime' DisplayName='${xml(d)}' Name='${n}' StaticName='${n}' Format='DateTime' />`;
  const dateOnly = (n, d) => `<Field Type='DateTime' DisplayName='${xml(d)}' Name='${n}' StaticName='${n}' Format='DateOnly' />`;
  const bool = (n, d) => `<Field Type='Boolean' DisplayName='${xml(d)}' Name='${n}' StaticName='${n}'><Default>0</Default></Field>`;
  const number = (n, d) => `<Field Type='Number' DisplayName='${xml(d)}' Name='${n}' StaticName='${n}' />`;
  const choice = (n, d, opts) =>
    `<Field Type='Choice' DisplayName='${xml(d)}' Name='${n}' StaticName='${n}' Format='Dropdown'>` +
    `<CHOICES>${opts.map(o => `<CHOICE>${xml(o)}</CHOICE>`).join("")}</CHOICES></Field>`;

  const SCHEMA = [
    { list: "CommunicationHub Categories", titleAs: "Category Name", fields: [
      text("CHCategoryID", "Category ID"),
      note("CHDescription", "Description"),
      text("CHImageRef", "Image Ref"),
      choice("CHIcon", "Icon", ICONS),
      dateTime("CHCreatedAt", "Created At"),
      dateTime("CHUpdatedAt", "Updated At"),
    ]},
    { list: "CommunicationHub Posts", titleAs: "Title", fields: [
      text("CHPostID", "Post ID"),
      text("CHCategoryID", "Category ID"),
      note("CHShortDescription", "Short Description"),
      note("CHFullDescription", "Full Description"),
      text("CHImageRef", "Image Ref"),
      dateOnly("CHPostDate", "Post Date"),
      choice("CHCreatedByRole", "Created By Role", ["Admin", "Supervisor"]),
      bool("CHAssignedToSupervisor", "Assigned To Supervisor"),
      dateTime("CHCreatedAt", "Created At"),
      dateTime("CHUpdatedAt", "Updated At"),
    ]},
    { list: "CommunicationHub HeroSlides", titleAs: "Title", fields: [
      text("CHSliderID", "Slider ID"),
      note("CHDescription", "Description"),
      text("CHImageRef", "Image Ref"),
      text("CHLinkedPostID", "Linked Post ID"),
      number("CHDisplayOrder", "Display Order"),
      bool("CHIsActive", "Is Active"),
      dateTime("CHCreatedAt", "Created At"),
      dateTime("CHUpdatedAt", "Updated At"),
    ]},
  ];

  const IMAGE_LIBRARY = "CommunicationHubImages";

  async function listExists(title) {
    try { await get(`/_api/web/lists/getbytitle('${q(title)}')?$select=Id`); return true; }
    catch { return false; }
  }

  async function ensureList(title, baseTemplate) {
    if (await listExists(title)) { log(`  · list "${title}" already exists`, "dim"); return; }
    await post("/_api/web/lists", {
      __metadata: { type: "SP.List" }, Title: title, BaseTemplate: baseTemplate, ContentTypesEnabled: false,
    });
    log(`  ✓ created list "${title}"`, "ok");
  }

  async function fieldExists(list, internalName) {
    try { await get(`/_api/web/lists/getbytitle('${q(list)}')/fields/getbyinternalnameortitle('${q(internalName)}')?$select=Id`); return true; }
    catch { return false; }
  }

  async function ensureField(list, schemaXml) {
    const name = schemaXml.match(/\sName='([^']+)'/)[1];
    if (await fieldExists(list, name)) { log(`    · ${name} already there`, "dim"); return; }
    await post(`/_api/web/lists/getbytitle('${q(list)}')/fields/createfieldasxml`, {
      parameters: { __metadata: { type: "SP.XmlSchemaFieldCreationInformation" }, SchemaXml: schemaXml, Options: ADD_OPTIONS },
    });
    log(`    ✓ ${name}`, "ok");
  }

  async function renameTitle(list, newLabel) {
    await post(`/_api/web/lists/getbytitle('${q(list)}')/fields/getbyinternalnameortitle('Title')`,
      { __metadata: { type: "SP.FieldText" }, Title: newLabel }, "MERGE");
  }

  async function enableVersioning(list, keep) {
    // The application writes nothing to anyone's device, so recovery has to live here. SharePoint's
    // own version history does it better than an exported file could: per-item restore, an audit
    // trail, and a 93-day recycle bin for deletions.
    await post(`/_api/web/lists/getbytitle('${q(list)}')`,
      { __metadata: { type: "SP.List" }, EnableVersioning: true, MajorVersionLimit: keep }, "MERGE");
    log(`  ✓ version history on (keeping ${keep})`, "ok");
  }

  // ---------------------------------------------------------------- data

  const DATA = {
    categories: [
      { CHCategoryID: "cat-3c5ad50f", Title: "ISA", CHDescription: "ISA Category", CHImageRef: "cat-3c5ad50f.jpg", CHIcon: "globe", CHCreatedAt: "2026-08-18T11:33:30Z", CHUpdatedAt: "2026-08-18T11:33:30Z" },
      { CHCategoryID: "cat-77799656", Title: "Safety", CHDescription: "Safety Category", CHImageRef: "cat-77799656.jpg", CHIcon: "shield", CHCreatedAt: "2026-08-18T11:33:52Z", CHUpdatedAt: "2026-08-18T11:33:52Z" },
      { CHCategoryID: "cat-d8b9dd77", Title: "Trainning", CHDescription: "Trainning Category", CHImageRef: "cat-d8b9dd77.jpg", CHIcon: "users", CHCreatedAt: "2026-08-18T11:34:17Z", CHUpdatedAt: "2026-08-18T11:34:17Z" },
    ],
    posts: [
      { CHPostID: "post-14d1fd37", Title: "ISA post", CHCategoryID: "cat-3c5ad50f", CHShortDescription: "", CHFullDescription: "ISA Post Description", CHImageRef: "post-14d1fd37.jpg", CHPostDate: "2026-08-18T11:34:55Z", CHCreatedByRole: "Admin", CHAssignedToSupervisor: false, CHCreatedAt: "2026-08-18T11:34:55Z", CHUpdatedAt: "2026-08-18T11:34:55Z" },
    ],
    heroSlides: [
      { CHSliderID: "slide-641027b0", Title: "Hero Slide", CHDescription: "Hero Slide Desc", CHImageRef: "slide-641027b0.jpg", CHLinkedPostID: "", CHDisplayOrder: 1, CHIsActive: true, CHCreatedAt: "2026-08-18T11:35:44Z", CHUpdatedAt: "2026-08-18T11:35:44Z" },
      { CHSliderID: "slide-ddec6fcf", Title: "Hero slide 2", CHDescription: "Hero 2", CHImageRef: "", CHLinkedPostID: "", CHDisplayOrder: 2, CHIsActive: true, CHCreatedAt: "2026-08-18T11:36:09Z", CHUpdatedAt: "2026-08-18T11:36:09Z" },
    ],
  };

  const LIST_OF = { categories: "CommunicationHub Categories", posts: "CommunicationHub Posts", heroSlides: "CommunicationHub HeroSlides" };
  const ID_FIELD = { categories: "CHCategoryID", posts: "CHPostID", heroSlides: "CHSliderID" };

  async function entityType(list) {
    const l = await get(`/_api/web/lists/getbytitle('${q(list)}')?$select=ListItemEntityTypeFullName`);
    return l.ListItemEntityTypeFullName;
  }

  async function importInto(key) {
    const list = LIST_OF[key], idField = ID_FIELD[key];
    const type = await entityType(list);
    const existing = await get(`/_api/web/lists/getbytitle('${q(list)}')/items?$select=${idField}&$top=5000`);
    const have = new Set(existing.value.map(i => i[idField]));

    for (const record of DATA[key]) {
      const id = record[idField];
      if (have.has(id)) { log(`  · ${id} already imported`, "dim"); continue; }
      await post(`/_api/web/lists/getbytitle('${q(list)}')/items`, { __metadata: { type }, ...record });
      log(`  ✓ ${id}`, "ok");
    }
  }

  // ---------------------------------------------------------------- steps

  function wire(id, label, fn) {
    const btn = document.getElementById(id);
    btn.addEventListener("click", async () => {
      document.querySelectorAll("button").forEach(b => (b.disabled = true));
      log(`\n=== ${label} ===`, "warn");
      try { await fn(); log(`=== ${label}: done ===`, "ok"); }
      catch (e) { log(`✗ ${e.message}`, "err"); log("Fix the cause and click again - the step resumes where it stopped.", "warn"); }
      finally { document.querySelectorAll("button").forEach(b => (b.disabled = false)); }
    });
  }

  wire("stepSchema", "Create lists & columns", async () => {
    for (const spec of SCHEMA) {
      log(`\n${spec.list}`);
      await ensureList(spec.list, 100);          // 100 = generic list
      await renameTitle(spec.list, spec.titleAs);
      for (const f of spec.fields) await ensureField(spec.list, f);
      await enableVersioning(spec.list, 500);
    }
    log(`\n${IMAGE_LIBRARY}`);
    await ensureList(IMAGE_LIBRARY, 101);        // 101 = document library
    await enableVersioning(IMAGE_LIBRARY, 100);
  });

  wire("stepData", "Import records", async () => {
    for (const key of ["categories", "posts", "heroSlides"]) {
      log(`\n${LIST_OF[key]}`);
      await importInto(key);
    }
    log(`\nPictures: drag the 5 files from setup\\images\\ into the "${IMAGE_LIBRARY}" library.`, "warn");
    log(`Their names already match what the records point at, so nothing else to change.`, "warn");
  });

  wire("stepVerify", "Verify", async () => {
    let problems = 0;
    for (const spec of SCHEMA) {
      const ok = await listExists(spec.list);
      log(`${ok ? "✓" : "✗"} list ${spec.list}`, ok ? "ok" : "err");
      if (!ok) { problems++; continue; }
      for (const f of spec.fields) {
        const name = f.match(/\sName='([^']+)'/)[1];
        const has = await fieldExists(spec.list, name);
        if (!has) { log(`  ✗ missing column ${name}`, "err"); problems++; }
      }
      const items = await get(`/_api/web/lists/getbytitle('${q(spec.list)}')/items?$select=Id&$top=5000`);
      log(`  ${items.value.length} item(s)`, "dim");
    }
    const lib = await listExists(IMAGE_LIBRARY);
    log(`${lib ? "✓" : "✗"} library ${IMAGE_LIBRARY}`, lib ? "ok" : "err");
    if (!lib) problems++;
    else {
      const files = await get(`/_api/web/GetFolderByServerRelativeUrl('${q(new URL(webUrl).pathname + "/" + IMAGE_LIBRARY)}')/Files?$select=Name`);
      log(`  ${files.value.length} picture(s): ${files.value.map(f => f.Name).join(", ") || "none yet"}`, files.value.length ? "dim" : "warn");
    }
    log(problems === 0 ? "\nEverything is in place. Open Userpage.html." : `\n${problems} problem(s) - re-run step 1.`, problems === 0 ? "ok" : "err");
  });
  </script>
</body>
</html>
