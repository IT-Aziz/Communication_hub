<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CommunicationHub hosting test</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 44rem; margin: 3rem auto; padding: 0 1.5rem; line-height: 1.6; color: #111827; }
    .box { padding: 1rem 1.25rem; border-radius: .5rem; margin: 1rem 0; }
    .ok { background: #ecfdf5; border: 1px solid #059669; }
    .bad { background: #fef2f2; border: 1px solid #dc2626; }
    .wait { background: #f8fafc; border: 1px solid #cbd5e1; }
    .loud { background: #fffbeb; border: 2px solid #d97706; }
    code { background: #f1f5f9; padding: .12rem .4rem; border-radius: .25rem; word-break: break-all; }
    h1 { margin-bottom: .3rem; }
  </style>
</head>
<body>
  <!--
    Upload this next to the app and open it BY ITS DIRECT URL. It answers, in about ten seconds,
    the only questions that decide whether the project can run inside SharePoint.

    The first thing it checks is whether you actually opened it directly, because SharePoint's
    file preview is a trap: clicking an .html file in a document library renders it inside a
    sandboxed iframe. Scripts run, so the page looks like it is working - but the sandbox has no
    origin, so every call to /_api/ fails, and the result looks like a broken app rather than the
    wrong way of opening it.
  -->
  <h1>Hosting test</h1>
  <p id="intro">Checking…</p>

  <div id="results"></div>

  <p style="color:#6b7280">Delete this file once you are done with it.</p>

  <script>
    const results = document.getElementById("results");
    const intro = document.getElementById("intro");

    function box(cls, title, detail) {
      const d = document.createElement("div");
      d.className = "box " + cls;
      d.innerHTML = `<strong>${title}</strong>` + (detail ? `<br>${detail}` : "");
      results.appendChild(d);
      return d;
    }

    // --- Test 0: is this the preview pane rather than the real page? -----------------
    // A sandboxed iframe reports its origin as the *string* "null", which is also why the
    // fetch below would fail with "Failed to parse URL from null/_api/...". Catching it here
    // turns a confusing error into a clear instruction.
    const framed = window.top !== window.self;
    const noOrigin = window.location.origin === "null" || !window.location.origin;
    // The one that matters most, and the one this page originally missed: a file:// URL means
    // SharePoint handed the browser the file as a *download* instead of serving it as a page.
    // That is the exact symptom of Custom scripts being switched off, and nothing about the
    // page's own behaviour distinguishes it - it renders and runs scripts perfectly well from
    // a temp folder, which is precisely why it fools you.
    const downloaded = window.location.protocol === "file:";

    if (downloaded) {
      intro.textContent = "";
      box("loud",
        "This is a downloaded copy on your computer, not a page served by SharePoint.",
        `The address bar shows <code>${window.location.protocol}//</code> — SharePoint sent the file to your
         Downloads folder rather than displaying it.
         <br><br><strong>That is the symptom of Custom scripts still being switched off on this site.</strong>
         Rendering here proves nothing: a downloaded .html file always renders, and its inline scripts
         always run. What it cannot do is reach <code>/_api/</code>, which is why test 3 fails.
         <br><br>Ask your SharePoint admin to set <em>Active sites → your site → Settings → Custom scripts →
         Allowed</em>, wait about 15 minutes, then open the file's real URL
         (<code>https://…sharepoint.com/sites/…/hosting-test.html</code>) again.
         When the setting is live, that URL will display instead of downloading.`);
    } else if (framed || noOrigin) {
      intro.textContent = "";
      const guess = document.referrer || window.location.href;
      const site = (guess.match(/^https?:\/\/[^/]+\/(?:sites|teams)\/[^/]+/i) || [])[0] || "https://YOUR-TENANT.sharepoint.com/sites/YOUR-SITE";
      box("loud",
        "Stop — you are looking at SharePoint's file preview, not the page.",
        `Clicking an .html file in a document library opens it in a sandboxed frame. Scripts run, but
         the frame has no origin, so nothing can talk to SharePoint.
         <br><br><strong>Open the file by its direct URL instead:</strong> copy the folder path from the
         library and type the file name on the end, for example
         <br><code>${site}/Shared%20Documents/&lt;your-folder&gt;/setup/hosting-test.html</code>
         <br><br>Detected: ${framed ? "running inside a frame" : ""}${framed && noOrigin ? " and " : ""}${noOrigin ? "no page origin" : ""}.`);
    } else {
      intro.textContent = "Opened directly — good. Running the checks:";

      box("ok", "Test 1 passed: SharePoint served this as a real page.",
        `Served over <code>${window.location.protocol}//</code> from <code>${window.location.host}</code> — not a
         download, not a preview frame. Custom scripts is allowed on this site.`);

      box("ok", "Test 2 passed: JavaScript runs.", "Inline scripts execute here.");

      const m = window.location.pathname.match(/^\/(sites|teams)\/[^/]+/i);
      const web = window.location.origin + (m ? m[0] : "");
      const t3 = box("wait", "Test 3: asking the SharePoint REST API…", `<code>${web}/_api/web</code>`);

      fetch(`${web}/_api/web?$select=Title,Url`, {
        credentials: "include",
        headers: { Accept: "application/json;odata=nometadata" },
      })
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status))))
        .then((site) => {
          t3.className = "box ok";
          t3.innerHTML =
            "<strong>Test 3 passed: SharePoint answered as you.</strong><br>" +
            `Site: <code>${site.Title}</code><br>Detected web URL: <code>${web}</code><br><br>` +
            "Everything the app needs is working. Continue with provision.html.";
        })
        .catch((e) => {
          t3.className = "box bad";
          t3.innerHTML =
            `<strong>Test 3 failed: ${e.message}</strong><br>Tried: <code>${web}/_api/web</code><br>` +
            "The page is probably not served from the same SharePoint site as your lists.";
        });
    }
  </script>
</body>
</html>
