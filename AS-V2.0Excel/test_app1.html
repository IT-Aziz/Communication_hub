<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SharePoint / Local Hybrid Demo (Single File)</title>

  <!-- Official jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1.5rem;
      color: #1f2937;
      line-height: 1.5;
    }
    h1 { margin-bottom: 0.25rem; }
    #env-banner {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }
    #env-banner.local { background: #dbeafe; color: #1e40af; }
    #env-banner.sharepoint { background: #dcfce7; color: #166534; }

    #status {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      margin-bottom: 1rem;
    }
    #status.error { background: #fef2f2; border-color: #dc2626; color: #991b1b; }
    #status.ok { background: #ecfdf5; border-color: #059669; color: #065f46; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #e5e7eb;
      font-size: 0.9rem;
      word-break: break-word;
    }
    th { width: 35%; color: #6b7280; font-weight: 600; }
  </style>
</head>
<body>

  <h1>Site Info</h1>
  <span id="env-banner"></span>

  <div id="status">Loading…</div>

  <table id="result-table" hidden>
    <tbody id="result-body"></tbody>
  </table>

  <script>
    $(function () {
      "use strict";

      // ----------------------------------------------------------------
      // Mock data, embedded directly instead of fetched from a separate
      // mock-data.json. This is what lets the local path run by just
      // double-clicking the file (file:// origin) - no local server
      // needed, since there's no second file to request. Shaped to match
      // what SharePoint's /_api/web returns under odata=verbose, so the
      // same render code below works unchanged against either source.
      // ----------------------------------------------------------------
      var MOCK_RESPONSE = {
        d: {
          __metadata: { type: "SP.Web" },
          Title: "Local Dev Site (Mock)",
          Description: "Embedded sample data used when running from localhost or file://.",
          ServerRelativeUrl: "/sites/localdev",
          Language: 1033,
          WebTemplate: "STS",
          Created: "2026-08-19T09:00:00Z",
        },
      };

      // ----------------------------------------------------------------
      // 1. Environment detection
      //
      // Anything served from localhost/127.0.0.1, or opened directly as a
      // file (file://), is treated as local dev. Everywhere else is
      // assumed to be a real SharePoint site, since that's the only place
      // this file would ever be deployed.
      // ----------------------------------------------------------------
      var isLocal =
        window.location.protocol === "file:" ||
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1";

      // ----------------------------------------------------------------
      // 2. Get a jQuery promise either way, so the same .done()/.fail()
      // code below handles both environments identically. Locally that
      // promise resolves immediately with the embedded mock data instead
      // of making a network request at all.
      // ----------------------------------------------------------------
      var request;
      var requestUrl;

      if (isLocal) {
        $("#env-banner").addClass("local").text("Local Development");

        requestUrl = "(embedded mock data)";
        request = $.Deferred().resolve(MOCK_RESPONSE).promise();
      } else {
        $("#env-banner").addClass("sharepoint").text("SharePoint");

        // Relative pathing: no tenant or site name is hardcoded. If the page
        // is running inside SharePoint, _spPageContextInfo.webAbsoluteUrl is
        // published by SharePoint itself and is the most reliable source of
        // "which site am I in". Falling back to the current origin covers
        // the (rare) case where that global isn't present.
        var webUrl =
          (typeof _spPageContextInfo !== "undefined" && _spPageContextInfo.webAbsoluteUrl) ||
          window.location.origin;

        requestUrl = webUrl.replace(/\/$/, "") + "/_api/web";

        request = $.ajax({
          url: requestUrl,
          method: "GET",
          headers: {
            Accept: "application/json; odata=verbose",
          },
          xhrFields: {
            withCredentials: true, // send the user's existing SharePoint session cookie
          },
        });
      }

      console.log("[env]", isLocal ? "local" : "sharepoint");
      console.log("[ajax] requesting", requestUrl);

      // ----------------------------------------------------------------
      // 3. Render the result, or handle failure
      // ----------------------------------------------------------------
      request
        .done(function (response) {
          console.log("[ajax] success", response);

          // Both the embedded mock data and the SharePoint REST API
          // (odata=verbose) wrap the payload in a "d" property, so the
          // same rendering code works for either source unchanged.
          var site = response && response.d;

          if (!site) {
            renderError("Response did not contain the expected \"d\" payload.");
            return;
          }

          renderSite(site);
        })
        .fail(function (jqXHR, textStatus, errorThrown) {
          console.error("[ajax] failed", {
            url: requestUrl,
            status: jqXHR.status,
            textStatus: textStatus,
            errorThrown: errorThrown,
            responseText: jqXHR.responseText,
          });

          renderError(
            "Couldn't load site data (" +
              (jqXHR.status || "network error") +
              (textStatus ? " – " + textStatus : "") +
              "). See the browser console for details."
          );
        });

      // ----------------------------------------------------------------
      // Rendering helpers
      // ----------------------------------------------------------------
      function renderSite(site) {
        var $status = $("#status");
        $status.removeClass("error").addClass("ok").text("Loaded successfully.");

        var fields = [
          ["Title", site.Title],
          ["Description", site.Description],
          ["Server Relative URL", site.ServerRelativeUrl],
          ["Language", site.Language],
          ["Web Template", site.WebTemplate],
          ["Created", site.Created],
        ];

        var $body = $("#result-body").empty();
        fields.forEach(function (field) {
          var label = field[0];
          var value = field[1];
          if (value === undefined || value === null || value === "") return;

          $("<tr>")
            .append($("<th>").text(label))
            .append($("<td>").text(value))
            .appendTo($body);
        });

        $("#result-table").prop("hidden", false);
      }

      function renderError(message) {
        $("#status").removeClass("ok").addClass("error").text(message);
        $("#result-table").prop("hidden", true);
      }
    });
  </script>
</body>
</html>
